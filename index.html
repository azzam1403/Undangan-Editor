<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor Undangan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f0a16">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap">
<style>
:root{--bg:#3f0a16;--card:#521223;--gold:#e0b24a;--cream:#f6ecd6;--mute:#d9c3b0;--line:#7d4a3f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--gold);margin:0}
header{padding:22px 18px 6px;max-width:1100px;margin:0 auto}
h1{font-size:2rem}
header p{margin:.3rem 0 0;color:var(--mute);font-size:.95rem}
.wrap{max-width:1100px;margin:0 auto;padding:14px 18px 48px;display:grid;gap:22px}
@media(min-width:900px){.wrap{grid-template-columns:minmax(320px,440px) 1fr;align-items:start}.pv{position:sticky;top:12px}}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 16px;padding:14px 16px 6px}
legend{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;color:var(--gold);padding:0 6px}
label{display:block;font-size:.85rem;color:var(--mute);margin:0 0 12px}
input,textarea,select{display:block;width:100%;margin-top:4px;font:inherit;color:var(--cream);background:rgba(246,236,214,.08);border:1px solid var(--line);border-radius:6px;padding:.55rem .7rem}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv h2{font-size:1.4rem;margin-bottom:8px}
iframe{display:block;width:100%;max-width:420px;height:min(70vh,640px);border:1px solid var(--gold);border-radius:14px;background:#000}
button{font:inherit;font-weight:600;color:var(--bg);background:var(--gold);border:0;border-radius:999px;padding:.7rem 1.6rem;cursor:pointer;margin:14px 10px 0 0}
button:hover{background:#efc766}
button.s{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.msg{color:var(--mute);font-size:.9rem;margin-top:10px}
select option{color:#3f0a16;background:#f6ecd6}.w{border-left:2px solid var(--line);padding:4px 12px;margin:12px 0}.w .src{margin:2px 0 6px;word-break:break-all}.src{color:var(--mute);font-size:.85rem}.w button{margin:0 8px 0 0;padding:.35rem 1rem;font-size:.85rem}.swr{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.sw{margin:0;padding:.45rem .9rem;border-radius:8px;border:2px solid transparent;color:#fff;font-size:.85rem;text-shadow:0 1px 3px #000}.sw:hover{filter:brightness(1.15)}
#code{display:none;height:110px;font-size:.75rem}
</style>
</head>
<body>
<header><h1>Editor Undangan</h1><button class="s" id="ins" style="display:none;margin:8px 0 0">Pasang aplikasi</button><p>Isi kolom di bawah. Pratinjau berubah otomatis. Kalau sudah cocok, unduh filenya.</p></header>
<div class="wrap">
  <div id="form"></div>
  <div class="pv">
    <h2>Pratinjau</h2>
    <iframe id="pv" title="Pratinjau undangan" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
    <button id="dl">Unduh undangan (.html)</button><button class="s" id="rs">Kembalikan contoh</button>
    <p class="msg" id="msg">Klik “Buka Undangan” di pratinjau untuk melihat isinya.</p>
    <textarea id="code" readonly aria-label="Kode undangan"></textarea>
    <button class="s" id="cp" style="display:none">Salin kode</button>
  </div>
</div>
<script>

dient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 28px),linear-gradient(180deg,@@CP@@,var(--bg2));transition:transform 2s cubic-bezier(.77,0,.18,1)}\n.half::before{content:\"\";position:absolute;inset:0 0 24px;opacity:.1;background:var(--dia)}\n.half::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--band) repeat-x}\n.half.l{left:0;border-right:1px solid var(--gold2)}\n.half.r{right:0;border-left:1px solid var(--gold2)}\n.cover.gone .l{transform:translateX(-101%)}\n.cover.gone .r{transform:translateX(101%)}\n.seal{position:relative;z-index:2;padding:24px;max-width:420px;transition:opacity .7s,transform .9s}\n.seal::before{content:\"\";position:absolute;inset:-70px;z-index:-1;background:radial-gradient(circle,rgba(@@GR@@,.2),transparent 62%);animation:breathe 6s ease-in-out infinite}\n.cover.gone .seal{opacity:0;transform:scale(1.2)}\n.seal>*{animation:rise 1.3s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--i)*.28s)}\n.seal small{font-size:1rem;letter-spacing:.14em;color:var(--mute)}\n.seal h1{font-weight:400;font-size:2.6rem;line-height:1.15;margin:.4rem 0 1.2rem;color:var(--gold)}\n.emb{position:relative;width:140px;height:140px;margin:0 auto 16px}\n.hero .emb{width:104px;height:104px;margin:0 auto 12px}\n.emb svg{position:absolute;inset:0;width:100%;height:100%}\n.emb .rot{animation:spin 70s linear infinite}\n.rot *{fill:none;stroke:var(--gold);stroke-width:1.2}\n.rot use{stroke-dasharray:1;animation:draw 3.2s ease-out both}\nbutton{font:inherit;font-size:1.05rem;color:var(--bg2);background:var(--gold);border:0;padding:.75rem 2.2rem;border-radius:999px;cursor:pointer;animation:pulse 2.4s infinite}\nbutton:hover{background:@@GL@@}\nbutton:focus-visible{outline:2px solid var(--cream);outline-offset:4px}\na.btn{display:inline-block;color:var(--bg2);background:var(--gold);padding:.65rem 1.8rem;border-radius:999px;text-decoration:none}\n@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(@@GR@@,0)}0%{box-shadow:0 0 0 :0;transform:translateY(26px);transition:opacity 1.2s,transform 1.2s cubic-bezier(.2,.7,.2,1)}\n.sec.in{opacity:1;transform:none}\n.sec:not(.hero)::before{content:\"\";display:block;height:24px;max-width:260px;margin:0 auto 38px;background:var(--band) repeat-x center;clip-path:inset(0 50%);transition:clip-path 1.8s .3s cubic-bezier(.2,.7,.2,1)}\n.sec.in::before{clip-path:inset(0)}\n.ev{display:grid;gap:26px;margin-top:22px}\n.ev div{border:1px solid var(--gold2);padding:22px 16px;position:relative;transition:box-shadow .6s,transform .6s}\n.ev div::after{content:\"\";position:absolute;inset:5px;border:1px solid rgba(@@GR@@,.3);pointer-events:none}\n.ev div:hover{box-shadow:0 0 28px rgba(@@GR@@,.22);transform:translateY(-3px)}\n.ev b{display:block;font-weight:600;font-size:1.35rem;color:var(--gold)}\n.cd{display:flex;justify-content:center;gap:14px;margin-top:22px}\n.cd span{min-width:64px;padding:10px 0;border:1px solid var(--gold2);font-size:1.7rem;line-height:1.1}\n.cd em{display:block;font-style:normal;font-size:.85rem;color:var(--mute)}\na.map{display:inline-block;margin-top:12px;color:var(--gold);text-underline-offset:5px}\ninput,select,textarea{width:100%;font:inherit;font-size:1rem;color:var(--cream);background:rgba(246,236,214,.08);border:1px solid var(--gold2);border-radius:4px;padding:.65rem .8rem;margin-bottom:12px}\nselect option{color:#3f0a16;background:#f6ecd6}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.sec button{animation:none}\nbutton.s{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:.4rem 1.2rem;margin-top:12px;font-size:.95rem}\nbutton.s:hover{background:rgba(@@GR@@,.15)}\n.w{text-align:left;border-left:2px solid var(--gold2);padding:4px 14px;margin:14px 0}\n.w small{color:var(--mute);margin-left:8px}\n.w p{margin:.2rem 0;overflow-wrap:anywhere}\n.verse{font-size:1.7rem}\n.mus{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;width:46px;height:46px;padding:0;border-radius:50%;background:var(--bg2);color:var(--gold);border:1px solid var(--gold);font-size:1.3rem;animation:none;box-shadow:none}\n.mus.off{opacity:.55;text-decoration:line-through}\nbody:not(.open) .mus{display:none}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.hero>*{opacity:1}}\n.arch{width:min(240px,72%);aspect-ratio:3/4;margin:28px auto 0;border:2px solid var(--gold);border-radius:999px 999px 14px 14px;padding:6px;overflow:hidden}.arch img{width:100%;height:100%;object-fit:cover;border-radius:999px 999px 8px 8px;display:block}.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--gold2);display:block}@@BGCSS@@\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg width=\"0\" height=\"0\" style=\"position:absolute\">\u003cdefs>\n\u003csymbol id=\"rosette\" viewBox=\"0 0 100 100\">\u003ccircle pathLength=\"1\" cx=\"50\" cy=\"50\" r=\"48\"/>\u003ccircle pathLength=\"1\" cx=\"50\" cy=\"50\" r=\"22\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\" transform=\"rotate(45 50 50)\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\" transform=\"rotate(90 50 50)\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\" transform=\"rotate(135 50 50)\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\" transform=\"rotate(180 50 50)\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\" transform=\"rotate(225 50 50)\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\" transform=\"rotate(270 50 50)\"/>\u003cellipse pathLength=\"1\" cx=\"50\" cy=\"27\" rx=\"8\" ry=\"17\" transform=\"rotate(315 50 50)\"/>\u003c/symbol>\n\u003csymbol id=\"cres\" viewBox=\"0 0 \n    \u003ch2 class=\"names\" style=\"--i:4;font-style:normal\">\u003cspan class=\"sh\">@@B@@\u003ci>&amp;\u003c/i>@@G@@\u003c/span>\u003c/h2>\n    \u003cp class=\"date\" style=\"--i:5\">@@DATE@@\u003c/p>\n    @@HERO@@\u003cdiv class=\"cue\" style=\"--i:6\">Gulir ke bawah\u003cb>⌄\u003c/b>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec\">\n    \u003cp>Assalamu’alaikum Warahmatullahi Wabarakatuh\u003c/p>\n    \u003cp class=\"pan\" style=\"margin-top:22px\">\n      \u003cspan style=\"--d:0\">@@P1@@\u003c/span>\n      \u003cspan style=\"--d:1\">@@P2@@\u003c/span>\n      \u003cspan style=\"--d:2\">@@P3@@\u003c/span>\n      \u003cspan style=\"--d:3\">@@P4@@\u003c/span>\n    \u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"sec\" id=\"s-ayat\">\n    \u003cp class=\"verse ar\">وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً\u003c/p>\n    \u003cp>Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan pasangan untukmu dari jenismu sendiri, agar kamu merasa tenteram kepadanya, dan Dia menjadikan di antaramu rasa kasih dan sayang.\u003c/p>\n    \u003cp class=\"src\">QS. Ar-Rum: 21\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"sec\">\n    \u003ch2>Mempelai\u003c/h2>\n    \u003cp>\u003cb>@@BF@@\u003c/b>\u003cbr>Putri dari @@BP@@\u003c/p>\n    \u003cp style=\"color:var(--gold)\">dengan\u003c/p>\n    \u003cp>\u003cb>@@GF@@\u003c/b>\u003cbr>Putra dari @@GP@@\u003c/p>\n  \u003c/section>\n\n  @@GAL@@\u003csection class=\"sec\">\n    \u003ch2>Acara\u003c/h2>\n    \u003cdiv class=\"ev\">\n      \u003cdiv>\u003cb>Akad Nikah\u003c/b>@@AKAD@@\u003c/div>\n      \u003cdiv>\u003cb>Resepsi\u003c/b>@@RESEP@@\u003c/div>\n    \u003c/div>\n    \u003cp style=\"margin-top:24px\">@@VENUE@@\u003cbr>@@ADDR@@\u003c/p>\n    \u003ca class=\"map\" href=\"https://www.google.com/maps/search/?api=1&query=@@MAPQ@@\" target=\"_blank\" rel=\"noopener\">Buka di Google Maps\u003c/a>\n    \u003cdiv
